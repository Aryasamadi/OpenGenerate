[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengenerate"
version = "0.1.0"
description = "Telegram channel content-automation platform (modular monolith on PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.32",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=24.4",
  "cryptography>=43",
  "httpx>=0.28,<0.29",
  "starlette>=0.41",
  "uvicorn>=0.32",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "pixeltable-pgserver>=0.3; platform_system == 'Windows'",
]

[project.scripts]
opengenerate = "opengenerate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opengenerate = ["migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S104", "S608", "B905"]
"src/opengenerate/infrastructure/db/*.py" = ["S608"]
"src/opengenerate/infrastructure/backup.py" = ["S603", "S607", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg.*", "prometheus_client.*", "pixeltable_pgserver.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "opengenerate"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["opengenerate.domain"]
forbidden_modules = [
  "opengenerate.application", "opengenerate.infrastructure",
  "opengenerate.interfaces", "opengenerate.bootstrap",
  "sqlalchemy", "asyncpg", "httpx", "starlette", "telegram",
]

[[tool.importlinter.contracts]]
name = "application depends only on domain"
type = "forbidden"
source_modules = ["opengenerate.application"]
forbidden_modules = [
  "opengenerate.infrastructure", "opengenerate.interfaces", "opengenerate.bootstrap",
  "sqlalchemy", "asyncpg", "httpx", "starlette", "telegram",
]

[[tool.importlinter.contracts]]
name = "infrastructure does not import interfaces or bootstrap"
type = "forbidden"
source_modules = ["opengenerate.infrastructure"]
forbidden_modules = ["opengenerate.interfaces", "opengenerate.bootstrap"]
