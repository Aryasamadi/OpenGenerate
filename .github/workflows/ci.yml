name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: og
          POSTGRES_PASSWORD: og_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OG_TEST_DATABASE_URL: postgresql://og:og_test_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install postgresql-client and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy strict type-check
        run: mypy
      - name: Import-linter hexagonal architecture boundaries
        run: lint-imports
      - name: Run full test suite (Phase 1, Phase 2, Unit & PostgreSQL Integration)
        run: pytest -v
