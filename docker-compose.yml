services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opengenerate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-opengenerate}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-opengenerate} -d $${POSTGRES_DB:-opengenerate}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OG_DATABASE_URL: ${OG_DATABASE_URL}
      OG_BOT_TOKEN: ${OG_BOT_TOKEN}
      OG_SUPERADMIN_IDS: ${OG_SUPERADMIN_IDS}
      OG_ENCRYPTION_KEYS: ${OG_ENCRYPTION_KEYS}
      OG_ENVIRONMENT: ${OG_ENVIRONMENT:-prod}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OG_DATABASE_URL: ${OG_DATABASE_URL}
      OG_BOT_TOKEN: ${OG_BOT_TOKEN}
      OG_SUPERADMIN_IDS: ${OG_SUPERADMIN_IDS}
      OG_ENCRYPTION_KEYS: ${OG_ENCRYPTION_KEYS}
      OG_ENVIRONMENT: ${OG_ENVIRONMENT:-prod}
      OG_OPS_HOST: "0.0.0.0"
      OG_OPS_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pg_data:
